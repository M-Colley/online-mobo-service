name: tests

# Paths are relative to the standalone online-mobo-service repository root.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Compile all modules
        run: python -m py_compile space.py optimizer_core.py study_contract.py main.py simulate.py tests/test_service.py tests/test_space.py tests/test_export.py analysis/export_firestore.py inspect_db.py

      - name: Print study configuration
        run: python space.py

      - name: Unit tests (search space)
        run: python tests/test_space.py

      - name: Optimizer simulation
        run: python simulate.py

      - name: Full HTTP service test
        run: python tests/test_service.py

      - name: Export contract tests
        run: python tests/test_export.py

      - name: Firestore trigger retry tests
        run: node --test firebase/test_index.cjs
